[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "process-ecosystem-monitor"
version = "0.1.0"
description = "Turn the Linux process tree into a living, animated ecosystem in your terminal."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["process-monitor", "tui", "linux", "proc", "visualization", "curses"]
classifiers = [
    "Environment :: Console :: Curses",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://github.com/ThorrijaDEV/process-ecosystem-monitor"

[project.scripts]
process-ecosystem = "process_ecosystem.cli:main"

[tool.setuptools]
packages = ["process_ecosystem"]
